name: Daily update
on:
  schedule:
    # GitHub's star day closes at 07:00 or 08:00 UTC (midnight Pacific). Two runs, off the busy top of the
    # hour: GitHub skipped the 14:00 run on 2026-11-04. The second run is the backup and refreshes "so far".
    - cron: "17 9,15 * * *"
  push:                    # a code change goes live at once (the job's own data commits never trigger it)
    branches: [main]
    paths: ["truestars.py", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: write   # commit the day's history file and the AI pictures
  pages: write      # publish the site
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Collect today's data and build the site
        run: python3 -I truestars.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}   # YouTube (and the Reddit test); optional
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}   # X post counts, prepaid; optional
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # the AI step, when AI_MODE in truestars.py is on; optional
      - name: Save the day's history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data   # the day's history file and the AI pictures (.gitignore leaves out the rest)
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%F)"
          git push
      - if: hashFiles('ai-samples/samples.json') != ''   # AI_MODE "samples": for the owner to look at, not the site
        uses: actions/upload-artifact@v4
        with:
          name: ai-samples
          path: ai-samples
          retention-days: 3
      - if: vars.PAGES_ON == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing waits for go-live: GitHub Pages is free only for public repos. At launch: make the
  # repo public, turn Pages on (source: GitHub Actions) and set the repo variable PAGES_ON to true.
  deploy:
    needs: update
    if: vars.PAGES_ON == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
