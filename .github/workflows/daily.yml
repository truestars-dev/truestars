name: Daily update
on:
  schedule:
    # GitHub's star day closes at 07:00 or 08:00 UTC (midnight Pacific). Two runs, off the busy top of the
    # hour: GitHub skipped the 14:00 run on 2026-11-04. The second run is the backup and refreshes "so far".
    - cron: "17 9,15 * * *"
  push:                    # a code change goes live at once (the job's own data commits never trigger it)
    branches: [main]
    paths: ["truestars.py", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: write   # commit the day's history file
  pages: write      # publish the site
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Collect today's data and build the site
        run: python3 -I truestars.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the day's history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/days
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%F)"
          git push
      - if: vars.PAGES_ON == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing waits for go-live: GitHub Pages is free only for public repos. At launch: make the
  # repo public, turn Pages on (source: GitHub Actions) and set the repo variable PAGES_ON to true.
  deploy:
    needs: update
    if: vars.PAGES_ON == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
